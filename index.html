<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetterLAN</title>
<meta name="description" content="BetterLAN: System Link over the internet for PS4 and PS5.">
<link rel="icon" type="image/png" href="/betterlan-site/favicon.png">
<link rel="apple-touch-icon" href="/betterlan-site/apple-touch-icon.png">
<meta name="theme-color" content="#080a0f">
<link rel="manifest" href="/betterlan-site/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BetterLAN">
<meta property="og:title" content="BetterLAN">
<meta property="og:description" content="Who is online and playing on the BetterLAN relay.">
<meta property="og:image" content="https://itsjokerzz.github.io/betterlan-site/brand/bn.png">
<style>
  html,body{height:100%;margin:0;background:#080a0f}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
  .fallback{position:fixed;inset:0;display:grid;place-items:center;color:#b0b7c3;
    font:15px/1.5 system-ui,sans-serif;text-align:center;z-index:-1}
  .fallback img{width:min(320px,80vw);height:auto;filter:drop-shadow(0 8px 24px rgba(40,120,255,.35))}
  .fallback a{color:#8aa2ff}
</style>
</head>
<body>
<div class="fallback">
  <div><img src="/betterlan-site/brand/logo-word.png" alt="BetterLAN">
  <p>Loading the dashboard… <a id="direct" href="https://pi-ubuntu.tail5429b.ts.net/">open it directly</a></p></div>
</div>
<script>
  // The dashboard, shown in place so this address stays in the bar. Anything
  // after the address (?t=key, #page) is handed on to it.
  var target = "https://pi-ubuntu.tail5429b.ts.net/";
  // Your admin key: given once as ?t=..., kept in this browser only (never in
  // this site's files), and passed on after that. ?forget clears it.
  var q = new URLSearchParams(location.search), key = q.get("t");
  try {
    if (q.has("forget")) { localStorage.removeItem("betterlan_t"); key = null; }
    else if (key) localStorage.setItem("betterlan_t", key);
    else key = localStorage.getItem("betterlan_t");
  } catch (e) {}
  q.delete("forget");
  if (key) q.set("t", key);
  var rest = q.toString();
  // tidy the address bar: the key need not sit there once it is remembered
  if (location.search) history.replaceState(null, "", location.pathname + location.hash);
  var f = document.createElement("iframe");
  f.src = target + (rest ? "?" + rest : "") + location.hash;
  f.title = "BetterLAN";
  f.allow = "clipboard-write";
  document.body.appendChild(f);
  document.getElementById("direct").href = f.src;
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://pi-ubuntu.tail5429b.ts.net/"></noscript>
</body>
</html>
